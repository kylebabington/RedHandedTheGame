<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" stitchTiles="stitch"/>
      <feDiffuseLighting lighting-color="#e9e1d2" surfaceScale="1.2">
        <feDistantLight azimuth="45" elevation="55"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  <rect width="240" height="240" fill="#e9e1d2"/>
  <rect width="240" height="240" filter="url(#paper)" opacity="0.35"/>
</svg>
